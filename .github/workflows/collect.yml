name: collect-tgvmax

on:
  schedule:
    # 08:00 UTC = 10:00 Paris (CEST). SNCF met a jour "debut de matinee".
    # Note: GitHub peut retarder les runs planifies de qqs min a qqs heures.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # permet un declenchement manuel depuis l'onglet Actions

permissions:
  contents: write         # necessaire pour committer les CSV via GITHUB_TOKEN

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python collect_tgvmax_metz_paris.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Rien de nouveau aujourd'hui."
          else
            git commit -m "data: capture $(date -u +%F)"
            git push
          fi
